databases:
  - name: icecream-postgres
    plan: free

services:
  # Django web service
  - type: web
    name: icecream-web
    runtime: docker
    plan: starter
    autoDeployTrigger: commit
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: icecream_outlet.settings
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"

      # Postgres (managed by Render)
      - key: DATABASE_URL
        fromDatabase:
          name: icecream-postgres
          property: connectionString

      # MySQL (private service below)
      - key: MYSQL_HOST
        fromService:
          name: icecream-mysql
          type: pserv
          property: host
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DB
        value: icecream_analytics
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        fromService:
          name: icecream-mysql
          type: pserv
          envVarKey: MYSQL_ROOT_PASSWORD

      # Redis (Render Key Value)
      - key: CELERY_BROKER_URL
        fromService:
          name: icecream-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: icecream-redis
          type: keyvalue
          property: connectionString

    dockerCommand: >
      bash -lc "bash start_web.sh"

  # Celery worker + beat (hourly sync)
  - type: worker
    name: icecream-celery
    runtime: docker
    plan: starter
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: icecream_outlet.settings
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        fromService:
          name: icecream-web
          type: web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        fromDatabase:
          name: icecream-postgres
          property: connectionString

      - key: MYSQL_HOST
        fromService:
          name: icecream-mysql
          type: pserv
          property: host
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_DB
        value: icecream_analytics
      - key: MYSQL_USER
        value: root
      - key: MYSQL_PASSWORD
        fromService:
          name: icecream-mysql
          type: pserv
          envVarKey: MYSQL_ROOT_PASSWORD

      - key: CELERY_BROKER_URL
        fromService:
          name: icecream-redis
          type: keyvalue
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: icecream-redis
          type: keyvalue
          property: connectionString

    dockerCommand: >
      bash -lc "bash start_worker.sh"

  # Redis Key Value
  - type: keyvalue
    name: icecream-redis
    plan: starter
    ipAllowList: []

  # MySQL private service (Docker-based) with disk
  - type: pserv
    name: icecream-mysql
    runtime: image
    image:
      url: mysql:8
    plan: starter
    envVars:
      - key: MYSQL_DATABASE
        value: icecream_analytics
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
